<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cx    { fill: #E2E8F0; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .tit   { font-size: 17px; font-weight: 600; }
      .sub   { font-size: 12px; fill: #94A3B8; font-family: Consolas, Menlo, Monaco, monospace; }
      .edge  { font-size: 11px; fill: #64748B; font-family: Consolas, Menlo, Monaco, monospace; letter-spacing: 1px; }
      .caixa { fill: #111C36; }
      .fio   { stroke: #334155; stroke-width: 1.6; fill: none; }
    </style>

    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <path id="p-cli" d="M175,168 L232,168"/>
    <path id="p-web" d="M392,168 C424,168 424,96 452,96"/>
    <path id="p-api" d="M392,168 C424,168 424,240 452,240"/>
    <path id="p-pri" d="M672,240 L716,240"/>
    <path id="p-sql" d="M916,240 L960,240"/>
  </defs>

  <rect width="1200" height="340" fill="#0B132B" rx="18" ry="18"/>

  <rect x="428" y="42" width="716" height="252" rx="16" ry="16"
        fill="none" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="446" y="34" class="edge">DOCKER COMPOSE &#183; VPS LINUX</text>

  <g class="fio">
    <use href="#p-cli"/>
    <use href="#p-web"/>
    <use href="#p-api"/>
    <use href="#p-pri"/>
    <use href="#p-sql"/>
  </g>

  <g>
    <circle r="3.5" fill="#38BDF8">
      <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p-cli"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#61DAFB">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.5s"><mpath href="#p-web"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle r="3.5" fill="#E0234E">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.5s"><mpath href="#p-api"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle r="3.5" fill="#818CF8">
      <animateMotion dur="1.8s" repeatCount="indefinite" begin="1.1s"><mpath href="#p-pri"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle r="3.5" fill="#48D1CC">
      <animateMotion dur="1.8s" repeatCount="indefinite" begin="1.5s"><mpath href="#p-sql"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <text x="188" y="158" class="edge">HTTPS</text>
  <text x="686" y="230" class="edge">ORM</text>
  <text x="928" y="230" class="edge">SQL</text>

  <g filter="url(#sombra)">

    <rect class="caixa" x="42" y="138" width="133" height="60" rx="12" ry="12"
          stroke="#38BDF8" stroke-width="1.6"/>
    <text class="cx tit" x="108" y="164" text-anchor="middle">Cliente</text>
    <text class="sub"    x="108" y="182" text-anchor="middle">navegador</text>

    <rect class="caixa" x="232" y="138" width="160" height="60" rx="12" ry="12"
          stroke="#24A1C1" stroke-width="1.6"/>
    <text class="cx tit" x="312" y="164" text-anchor="middle">Traefik</text>
    <text class="sub"    x="312" y="182" text-anchor="middle">proxy + TLS</text>

    <rect class="caixa" x="452" y="58" width="220" height="76" rx="12" ry="12"
          stroke="#61DAFB" stroke-width="1.6"/>
    <text class="cx tit" x="562" y="84"  text-anchor="middle">React 19 + Vite 6</text>
    <text class="sub"    x="562" y="103" text-anchor="middle">SPA est&#225;tica via nginx</text>
    <text class="sub"    x="562" y="120" text-anchor="middle" fill="#61DAFB">dominio.com.br</text>

    <rect class="caixa" x="452" y="202" width="220" height="76" rx="12" ry="12"
          stroke="#E0234E" stroke-width="1.6"/>
    <text class="cx tit" x="562" y="228" text-anchor="middle">NestJS 11</text>
    <text class="sub"    x="562" y="247" text-anchor="middle">Zod &#183; JWT &#183; Swagger</text>
    <text class="sub"    x="562" y="264" text-anchor="middle" fill="#E0234E">api.dominio.com.br</text>

    <rect class="caixa" x="716" y="202" width="200" height="76" rx="12" ry="12"
          stroke="#818CF8" stroke-width="1.6"/>
    <text class="cx tit" x="816" y="234" text-anchor="middle">Prisma 7</text>
    <text class="sub"    x="816" y="254" text-anchor="middle">schema tipado</text>

    <rect class="caixa" x="960" y="202" width="168" height="76" rx="12" ry="12"
          stroke="#4479A1" stroke-width="1.6"/>
    <text class="cx tit" x="1044" y="234" text-anchor="middle">MySQL 8.4</text>
    <text class="sub"    x="1044" y="254" text-anchor="middle">rede compartilhada</text>

  </g>

  <text x="600" y="318" class="edge" text-anchor="middle">
    Controller &#8594; Service &#8594; Repository &#8594; Prisma &#8592; a regra de neg&#243;cio nunca toca o banco direto
  </text>
</svg>
