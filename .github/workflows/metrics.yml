name: Metrics

on:
  schedule:
    # 06:41 UTC = 03:41 America/Sao_Paulo.
    # Minuto quebrado de proposito: cron em hora cheia entra na fila mais
    # disputada do GitHub e costuma atrasar de 2 a 4 horas.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Evita duas execucoes simultaneas commitando o mesmo arquivo.
concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics SVG
        # Versao fixada. "@latest" quebra sozinho quando sai release nova
        # e abre espaco para supply-chain attack.
        uses: lowlighter/metrics@v3.34
        with:
          filename: github-metrics.svg

          # IMPORTANTE: precisa ser um Personal Access Token (classic) com
          # escopo "public_repo", salvo em Settings > Secrets > METRICS_TOKEN.
          # O secrets.GITHUB_TOKEN padrao so enxerga ESTE repositorio, por isso
          # as metricas mostravam "1 Repository" e "0 Languages".
          token: ${{ secrets.METRICS_TOKEN }}

          # Token secundario, usado apenas para commitar o SVG de volta.
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # visual
          config_display: large
          config_padding: 0, 10
          config_output: svg
          config_timezone: America/Sao_Paulo
          config_animations: yes

          # resiliencia: nao falha o workflow por instabilidade da API
          retries: 3
          retries_delay: 300
          plugins_errors_fatal: no

          # modulos base
          base: header, activity, community, repositories

          # linguagens
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, dockerfile, shell
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_sections: most-used

          # calendario de atividade do ultimo ano
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
