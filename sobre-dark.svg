<svg width="1200" height="270" viewBox="0 0 1200 270" xmlns="http://www.w3.org/2000/svg">
  <!--
    Padrao de animacao: o estado BASE de cada elemento e o estado FINAL (visivel).
    A animacao comeca em begin="0s" e usa keyTimes para escalonar as entradas.
    Assim, em qualquer renderizador que nao execute SMIL (app mobile do GitHub,
    previews de link, leitores RSS, conversores para PNG), o conteudo aparece
    normalmente em vez de ficar invisivel.
  -->
  <defs>
    <style>
      .texto    { fill: #F8FAFC; }
      .marcador { fill: #38BDF8; }
      .d1 { fill: #38BDF8; }
      .d2 { fill: #48D1CC; }
      .d3 { fill: #3B82F6; }
      .d4 { fill: #22D3EE; }
      .rotulo { fill: #64748B; letter-spacing: 3px; }
    </style>

    <linearGradient id="barra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="80%"  stop-color="#48D1CC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#48D1CC" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="60" y="34" width="2" height="192" fill="url(#barra)">
    <animate attributeName="height" values="0;0;192" keyTimes="0;0.056;0.306"
             dur="3.6s" begin="0s" fill="freeze"/>
  </rect>

  <text x="82" y="30" class="rotulo"
        font-family="Consolas, Menlo, Monaco, 'Courier New', monospace" font-size="12">
    SOBRE
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.083;0.306"
             dur="3.6s" begin="0s" fill="freeze"/>
  </text>

  <g class="texto" font-family="Consolas, Menlo, Monaco, 'Courier New', monospace" font-size="20">

    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.194;0.444"
               dur="3.6s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
                        values="-24 0;-24 0;0 0" keyTimes="0;0.194;0.444"
                        dur="3.6s" begin="0s" fill="freeze"/>
      <text x="82" y="72">
        <tspan class="marcador">&#9656;</tspan>
        <tspan dx="12">Desenvolvedor</tspan>
        <tspan class="d1" dx="8">Full Stack</tspan>
        <tspan dx="8">em</tspan>
        <tspan class="d1" dx="8">Node.js</tspan>
        <tspan dx="8">&#8212; NestJS, React e TypeScript.</tspan>
      </text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.333;0.583"
               dur="3.6s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
                        values="-24 0;-24 0;0 0" keyTimes="0;0.333;0.583"
                        dur="3.6s" begin="0s" fill="freeze"/>
      <text x="82" y="114">
        <tspan class="marcador">&#9656;</tspan>
        <tspan class="d2" dx="12">Diversos sistemas Node em produ&#231;&#227;o</tspan>
        <tspan dx="8">com arquitetura e deploy padronizados.</tspan>
      </text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.472;0.722"
               dur="3.6s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
                        values="-24 0;-24 0;0 0" keyTimes="0;0.472;0.722"
                        dur="3.6s" begin="0s" fill="freeze"/>
      <text x="82" y="156">
        <tspan class="marcador">&#9656;</tspan>
        <tspan dx="12">Construo software pensando na</tspan>
        <tspan class="d3" dx="8">pr&#243;xima manuten&#231;&#227;o,</tspan>
        <tspan dx="8"> n&#227;o apenas na</tspan>
        <tspan class="d3" dx="8">pr&#243;xima entrega</tspan>
        <tspan>.</tspan>
      </text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.611;0.861"
               dur="3.6s" begin="0s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
                        values="-24 0;-24 0;0 0" keyTimes="0;0.611;0.861"
                        dur="3.6s" begin="0s" fill="freeze"/>
      <text x="82" y="198">
        <tspan class="marcador">&#9656;</tspan>
        <tspan dx="12">Sistema de consumo com QR Code que gerou</tspan>
        <tspan class="d4" dx="8">+R$ 200 mil</tspan>
        <tspan dx="8">em receita.</tspan>
      </text>
    </g>

  </g>

  <circle cx="140" cy="240" r="3" fill="#3B82F6" opacity="0.7">
    <animate attributeName="cy" values="240;220;240" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1080" cy="240" r="2.5" fill="#48D1CC" opacity="0.6">
    <animate attributeName="cy" values="240;212;240" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="620" cy="246" r="2" fill="#22D3EE" opacity="0.5">
    <animate attributeName="cy" values="246;228;246" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.7;0.15" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
